name: Publish to NuGet

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job request an OIDC token for NuGet Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Get version from the tag (v1.2.3 -> 1.2.3)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore -p:TestAllTfms=true

      - name: Test on net8.0, net9.0 and net10.0
        run: dotnet test -c Release --no-restore -p:TestAllTfms=true -p:Version=$VERSION

      - name: Pack
        run: dotnet pack src/ReCoLogger/ReCoLogger.csproj -c Release -p:Version=$VERSION -o artifacts

      # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived NuGet API key,
      # so no long-lived key is stored in the repository.
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # your nuget.org profile name, not the email

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate